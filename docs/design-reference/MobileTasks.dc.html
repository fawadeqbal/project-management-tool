<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile — My tasks</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/hearth/tokens.css">
<link rel="stylesheet" href="ds/hearth/components/bundle.css">
<script src="ds/hearth/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans)">
<header style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<h1 style="margin: 0; flex-grow: 1; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.03em">My tasks</h1>
<a href="#" aria-label="Filter" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary)"><x-import component-from-global-scope="Hearth.Icon" name="filter" size="{{twenty}}"></x-import></a>
<x-import component-from-global-scope="Hearth.Avatar" initials="FI" name="Fawad Iqbal" size="{{thirtytwo}}" color="blue"></x-import>
</div>
<div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; border-radius: 12px; background: var(--bg-subtle); border: 1px solid var(--border-default)">
<sc-for list="{{seg}}" as="s" hint-placeholder-count="3"><button role="tab" aria-selected="{{s.sel}}" style="height: 38px; border: 0; border-radius: 9px; font: 600 14px/20px var(--font-sans); color: {{s.color}}; background: {{s.bg}}; box-shadow: {{s.shadow}}">{{s.label}}</button></sc-for>
</div>
</header>
<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="padding: 14px 20px 6px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: {{g.color}}">{{g.label}}<span style="font-weight: 500; color: var(--text-tertiary)">{{g.count}}</span></div>
<sc-for list="{{g.rows}}" as="t" hint-placeholder-count="3">
<div style="position: relative; height: 64px; background: var(--brand-primary)">
<span style="position: absolute; left: 20px; top: 0; bottom: 0; display: flex; align-items: center; gap: 8px; color: var(--text-on-brand); font-size: 14px; font-weight: 600"><x-import component-from-global-scope="Hearth.Icon" name="check" size="{{twenty}}"></x-import>Done</span>
<div style="position: absolute; top: 0; bottom: 0; left: {{t.offset}}px; width: 390px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: var(--bg-surface); border-bottom: 1px solid var(--border-default); box-shadow: {{t.shadow}}">
<x-import component-from-global-scope="Hearth.TaskCheckbox" label="{{t.title}}"></x-import>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 16px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-tertiary)"><span style="width: 8px; height: 8px; border-radius: 3px; background: {{t.dot}}"></span>{{t.project}}<span style="color: {{t.dueColor}}; font-weight: 500">· {{t.due}}</span></span>
</div>
<x-import component-from-global-scope="Hearth.PriorityIcon" level="{{t.p}}"></x-import>
</div>
</div>
</sc-for>
</sc-for>
</div>
<a href="#" aria-label="Create task" style="position: absolute; right: 20px; bottom: 104px; width: 56px; height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: var(--brand-primary); color: var(--text-on-brand); box-shadow: var(--shadow-3)"><x-import component-from-global-scope="Hearth.Icon" name="plus" size="{{twentyfour}}"></x-import></a>
<nav aria-label="Tabs" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 26px; background: var(--bg-surface); border-top: 1px solid var(--border-default)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a href="#" aria-current="{{t.cur}}" style="position: relative; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.color}}; font-size: 11px; font-weight: 600">
<x-import component-from-global-scope="Hearth.Icon" name="{{t.icon}}" size="{{twentyfour}}"></x-import>{{t.label}}
<sc-if value="{{t.badge}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 2px; left: 52%; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9999px; background: var(--danger-solid); color: var(--text-on-brand); font-size: 11px; line-height: 18px; text-align: center">{{t.badge}}</span></sc-if>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const W = 'var(--accent-blue-dot)', Q = 'var(--accent-violet-dot)', M = 'var(--accent-sky-dot)';
    const r = (title, project, dot, due, p, extra) => Object.assign({ title, project, dot, due, p, offset: 0, shadow: 'none', dueColor: 'var(--text-tertiary)' }, extra || {});
    const sel = 'today';
    return {
      theme: this.props.theme ?? 'light', twenty: 20, twentyfour: 24, thirtytwo: 32,
      seg: [['today', 'Today'], ['upcoming', 'Upcoming'], ['later', 'Later']].map(([id, label]) => ({ label, sel: id === sel ? 'true' : 'false', color: id === sel ? 'var(--text-primary)' : 'var(--text-secondary)', bg: id === sel ? 'var(--bg-surface)' : 'transparent', shadow: id === sel ? 'var(--shadow-1)' : 'none' })),
      groups: [
        { label: 'Overdue', count: '1', color: 'var(--danger-text)', rows: [r('Review Q3 analytics dashboard', 'Website relaunch', W, '2 days ago', 'urgent', { dueColor: 'var(--danger-text)' })] },
        { label: 'Today', count: '4', color: 'var(--text-primary)', rows: [
          r('Write onboarding checklist copy', 'Q4 brand campaign', Q, 'Today', 'high', { offset: 112, shadow: 'var(--shadow-2)' }),
          r('Fix date picker focus trap', 'Mobile app v2', M, 'Today', 'medium'),
          r('Approve homepage hero illustrations', 'Website relaunch', W, 'Today', 'medium'),
          r('Reply to Northwind about walkthrough', 'Q4 brand campaign', Q, 'Today', 'low')
        ] },
        { label: 'Tomorrow', count: '2', color: 'var(--text-primary)', rows: [r('Draft sprint 24 retro agenda', 'Mobile app v2', M, 'Tomorrow', 'low'), r('Update pricing comparison table', 'Website relaunch', W, 'Tomorrow', 'medium')] }
      ],
      tabs: [['home', 'Home'], ['my-tasks', 'My tasks', true], ['inbox', 'Inbox', false, '4'], ['search', 'Search']].map(([icon, label, cur, badge]) => ({ icon, label, badge: badge || false, cur: cur ? 'page' : 'false', color: cur ? 'var(--brand-primary)' : 'var(--text-tertiary)' }))
    };
  }
}
</script>
</body>
</html>
